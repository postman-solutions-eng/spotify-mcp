$kind: http-request
name: Search adjacent tracks
description: |-
  `GET /v1/search` - the call behind the `search_music` tool, scoped to the seed
  artist from step 2. Uses `offset=20` to reach past the obvious top hits
  (the same "deeper cuts via offset" pattern the `discover_music_systematically`
  prompt documents), then filters out anything already in the user's top tracks.
method: GET
url: "https://api.spotify.com/v1/search?q=artist:{{seedArtist}}&type=track&limit=20&offset=20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("search returns 200", () => pm.response.to.have.status(200));
      const known = JSON.parse(pm.collectionVariables.get("knownTrackIds") || "[]");
      const items = pm.response.json().tracks.items.filter((t) => !known.includes(t.id));
      const picked = items.slice(0, 15).map((t) => `spotify:track:${t.id}`);
      pm.test("found at least one new track", () => pm.expect(picked.length).to.be.at.least(1));

      pm.collectionVariables.set("discoveryTrackUris", JSON.stringify(picked));
order: 3000
