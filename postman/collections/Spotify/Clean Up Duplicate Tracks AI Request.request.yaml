$kind: llm-request
name: Clean Up Duplicate Tracks AI Request
description: |-
  **Purpose:** an AI request that finds the user's biggest playlist and removes any
  exact duplicate tracks from it, mirroring `analyze_large_playlist`'s pagination
  strategy but letting the model act on what it finds instead of only describing it.

  Expects the model to chain `get_user_playlists` → `get_playlist_info` →
  `get_playlist_tracks` (paginated, 100 at a time) → `remove_tracks_from_playlist`.
  The literal HTTP calls behind that sequence are pinned down in the sibling REST
  collection **Spotify REST Workflow - Clean Up Duplicate Tracks**.

  Needs `ANTHROPIC_API_KEY` in addition to the usual `SPOTIFY_CLIENT_ID` /
  `SPOTIFY_CLIENT_SECRET` / `SPOTIFY_REDIRECT_URI`.
config:
  model: claude-sonnet-4-5
  provider: anthropic
url: https://api.anthropic.com/v1/messages
userPrompts:
  - id: "1"
    value: |-
      Find my largest playlist, page through all of its tracks, and remove any exact
      duplicate tracks you find (same track ID appearing more than once). Tell me
      which playlist you cleaned and how many duplicates you removed before doing it.
    timestamp: 1756080000000
    active: true
    type: text
systemPrompts:
  - id: "1"
    value: |-
      You are a Spotify library assistant. This task is destructive - removing
      tracks from a playlist cannot be undone - so read the full playlist with
      pagination before removing anything, only remove exact duplicate track IDs,
      and summarize what you are about to remove before calling the removal tool.
    timestamp: 1756080000000
    active: true
    type: text
mcpConfig: |-
  {
    "mcpServers": {
      "spotify": {
        "transport": "stdio",
        "command": "uvx spotify-mcp-jamiew",
        "env": {
          "SPOTIFY_CLIENT_ID": "{{SPOTIFY_CLIENT_ID}}",
          "SPOTIFY_CLIENT_SECRET": "{{SPOTIFY_CLIENT_SECRET}}",
          "SPOTIFY_REDIRECT_URI": "{{SPOTIFY_REDIRECT_URI}}"
        }
      }
    }
  }
enabledTools:
  - get_user_playlists
  - get_playlist_info
  - get_playlist_tracks
  - remove_tracks_from_playlist
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{ANTHROPIC_API_KEY}}"
    addTo: header
settings:
  temperature: 0.2
  maxToken: 2048
  streamResponse: false
  responseFormatJSON: false
  maxSteps: 16
  streamTools: false
order: 47000
