$kind: mcp-request
description: |-
  **Purpose:** enumerate available playback targets. The prerequisite for every playback
  tool: they need an *active* device.

  **Behaviour:** returns every device Spotify currently sees for the account, each with
  an `id`, `name`, `type` (Computer, Smartphone, Speaker…), `is_active` and
  `volume_percent`. Start here whenever a playback tool returns `NO_ACTIVE_DEVICE`:
  exactly one device is active at a time, and if none is, playback calls have nowhere to
  go until "Transfer playback" makes one active.

  Two things to expect:

  - **Ids are per-session, not stable.** Do not save one — re-read it here each time.
    This is why "Transfer playback" takes `{{DEVICE_ID}}` from the environment rather
    than hard-coding a value.
  - **The list changes on its own.** A device appears when its Spotify app opens and
    drops off after it idles, so a phone missing from one call can be present in the
    next with nothing having been configured.

  `type` matters for what you can do next: an iOS device (`Smartphone`, iPhone/iPad)
  will refuse `control_playback` with `action: volume` — see "90 percent volume".
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "list_devices",
      "arguments": {}
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 20000
