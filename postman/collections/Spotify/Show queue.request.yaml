$kind: mcp-request
description: |-
  **Purpose:** read what is playing plus the upcoming queue.

  **Result** (Executed 2026-08-25 against spotify-mcp-jamiew 0.4.1 (stdio)): `currently_playing` = "Und dann kommt ein Mensch" — Major Sunburn,
  followed by 10 queue entries that are all *the same track*.

  That repetition is a consequence of "Play MJRSBRN", not a bug: starting playback with an
  explicit `track_ids` list replaces the context with just those tracks, so Spotify pads
  the queue by repeating. Run this after playing a playlist context to see a varied
  queue.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_queue",
      "arguments": {}
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 23000
