$kind: mcp-request
description: |-
  **Purpose:** fetch artist metadata plus top tracks.

  **Result** (Executed 2026-08-25 against spotify-mcp-jamiew 0.4.1 (stdio)): **fails** —
  `Error executing tool get_artist_info: Playback is restricted for this content
  [playback_restricted]`.

  Root cause (traced in `fastmcp_server.py:804`): `get_artist_info` makes *two* upstream
  calls — `spotify_client.artist(artist_id)` and
  `spotify_client.artist_top_tracks(artist_id)`. The second is dead for this app and is
  **not** routed through `with_fallback`, so the whole tool fails.

  This is not a bad ID. The same error occurs for a known-good artist
  (`5zbSsk4Qg514fYzb3KhQX7`, Major Sunburn), so `get_artist_info` is dead for every
  artist. The `spotify://artist/{id}` resource works precisely because it omits the
  top-tracks call — compare "Artist Resource" in this collection.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "get_artist_info",
      "arguments": {
        "artist_id": "5gY5PFULD9iPkwMzZrYRAV"
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 18000
