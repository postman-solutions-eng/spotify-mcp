$kind: mcp-request
description: |-
  **Purpose:** append tracks to a playlist (up to 100 URIs per call).

  **Result:** Not executed: mutates the live account. Left documented, unrun, on purpose. Additive rather than destructive, but it would still modify a real
  playlist.
transport: stdio
command: uvx spotify-mcp-jamiew
env:
  SPOTIFY_CLIENT_ID: "{{SPOTIFY_CLIENT_ID}}"
  SPOTIFY_REDIRECT_URI: "{{SPOTIFY_REDIRECT_URI}}"
  SPOTIFY_CLIENT_SECRET: "{{SPOTIFY_CLIENT_SECRET}}"
message: |-
  {
    "method": "tools/call",
    "params": {
      "name": "add_tracks_to_playlist",
      "arguments": {
        "playlist_id": "1SFakhKgD1SbrY6DeUKUZQ",
        "track_uris": [
          "spotify:track:6ADPS6h7kuqZwqekUrLTEp"
        ]
      }
    }
  }
settings:
  version: auto
  requestTimeout: 0
order: 27000
