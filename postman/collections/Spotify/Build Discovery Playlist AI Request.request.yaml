$kind: llm-request
name: Build Discovery Playlist AI Request
description: |-
  **Purpose:** an AI request that turns the user's listening history into a new
  playlist, letting the model decide how to chain tools rather than scripting the
  JSON-RPC calls by hand.

  Expects the model to sequence `get_top_items` → `search_music` (possibly several
  times, varying the query/offset) → `create_playlist` → `add_tracks_to_playlist`.
  The exact HTTP calls behind that sequence - including which of the two Feb 2026
  API regimes each one lands on - are pinned down in the sibling REST collection
  **Spotify REST Workflow - Build Discovery Playlist**.

  Needs `ANTHROPIC_API_KEY` in addition to the usual `SPOTIFY_CLIENT_ID` /
  `SPOTIFY_CLIENT_SECRET` / `SPOTIFY_REDIRECT_URI`.
config:
  model: claude-sonnet-4-5
  provider: anthropic
url: https://api.anthropic.com/v1/messages
userPrompts:
  - id: "1"
    value: |-
      Build me a discovery playlist from my medium-term top tracks: find songs that
      are adjacent to what I already like but that I'm not already listening to, and
      put 15-20 of them in a new playlist called "AI Discovery Mix". Give it a short
      description saying what it's based on.
    timestamp: 1756080000000
    active: true
    type: text
systemPrompts:
  - id: "1"
    value: |-
      You are a Spotify listening assistant. Use the connected Spotify tools to read
      real listening history before searching - never invent track or artist names.
      Cross-check new finds against what the user already has so the playlist adds
      variety instead of repeating it. Explain your reasoning briefly after acting.
    timestamp: 1756080000000
    active: true
    type: text
mcpConfig: |-
  {
    "mcpServers": {
      "spotify": {
        "transport": "stdio",
        "command": "uvx spotify-mcp-jamiew",
        "env": {
          "SPOTIFY_CLIENT_ID": "{{SPOTIFY_CLIENT_ID}}",
          "SPOTIFY_CLIENT_SECRET": "{{SPOTIFY_CLIENT_SECRET}}",
          "SPOTIFY_REDIRECT_URI": "{{SPOTIFY_REDIRECT_URI}}"
        }
      }
    }
  }
enabledTools:
  - get_top_items
  - search_music
  - create_playlist
  - add_tracks_to_playlist
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{ANTHROPIC_API_KEY}}"
    addTo: header
settings:
  temperature: 0.6
  maxToken: 2048
  streamResponse: false
  responseFormatJSON: false
  maxSteps: 12
  streamTools: false
order: 45000
