$kind: llm-request
name: Resume Liked Songs AI Request
description: |-
  **Purpose:** an AI request that picks a device and starts playback on it, leaving
  the model to sequence the tool calls instead of a hand-written script.

  Expects the model to chain `list_devices` → `transfer_playback` →
  `get_saved_tracks` → `control_playback` (action=play). The literal HTTP calls that
  sequence produces are pinned down in the sibling REST collection **Spotify REST
  Workflow - Resume Liked Songs**.

  Needs `ANTHROPIC_API_KEY` in addition to the usual `SPOTIFY_CLIENT_ID` /
  `SPOTIFY_CLIENT_SECRET` / `SPOTIFY_REDIRECT_URI`.
config:
  model: claude-sonnet-4-5
  provider: anthropic
url: https://api.anthropic.com/v1/messages
userPrompts:
  - id: "1"
    value: |-
      Find my best available device (prefer anything that isn't a phone), switch
      playback to it, and start playing my liked songs from the top of the list.
      Tell me which device you picked and why.
    timestamp: 1756080000000
    active: true
    type: text
systemPrompts:
  - id: "1"
    value: |-
      You are a Spotify listening assistant. Use the connected Spotify tools to read
      real device and library state before acting - never invent device names or
      track IDs. If no device is available, say so instead of guessing. Explain your
      reasoning briefly after acting.
    timestamp: 1756080000000
    active: true
    type: text
mcpConfig: |-
  {
    "mcpServers": {
      "spotify": {
        "transport": "stdio",
        "command": "uvx spotify-mcp-jamiew",
        "env": {
          "SPOTIFY_CLIENT_ID": "{{SPOTIFY_CLIENT_ID}}",
          "SPOTIFY_CLIENT_SECRET": "{{SPOTIFY_CLIENT_SECRET}}",
          "SPOTIFY_REDIRECT_URI": "{{SPOTIFY_REDIRECT_URI}}"
        }
      }
    }
  }
enabledTools:
  - list_devices
  - transfer_playback
  - get_saved_tracks
  - control_playback
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{ANTHROPIC_API_KEY}}"
    addTo: header
settings:
  temperature: 0.3
  maxToken: 1024
  streamResponse: false
  responseFormatJSON: false
  maxSteps: 8
  streamTools: false
order: 46000
