$kind: llm-request
description: |-
  **Purpose:** an AI request that finds the user's biggest playlist and removes any
  exact duplicate tracks from it, mirroring `analyze_large_playlist`'s pagination
  strategy but letting the model act on what it finds instead of only describing it.

  Expects the model to chain `get_user_playlists` → `get_playlist_info` →
  `get_playlist_tracks` (paginated, 100 at a time) → `remove_tracks_from_playlist`.
  The literal HTTP calls behind that sequence are pinned down in the sibling REST
  collection **Spotify REST Workflow - Clean Up Duplicate Tracks**.

  Needs `ANTHROPIC_API_KEY` in addition to the usual `SPOTIFY_CLIENT_ID` /
  `SPOTIFY_CLIENT_SECRET` / `SPOTIFY_REDIRECT_URI`.
url: https://api.anthropic.com/v1/messages
config:
  model: claude-sonnet-4-5
  provider: anthropic
settings:
  temperature: 0.2
  maxToken: 2048
  streamResponse: false
  responseFormatJSON: false
  maxSteps: 16
  streamTools: false
userPrompts:
  - id: ab303594-d019-49b2-855b-bee4b4c00c8c
    value: |-
      Find my largest playlist and clean the exact duplicates out of it.

      Work out which playlist is biggest by paging its tracks — do not trust
      `total_tracks` from `get_user_playlists` or `get_playlist_info`, which come back
      null for this app. Page with `get_playlist_tracks` 100 at a time until a page
      returns fewer rows than you asked for, and note that `total` echoes the page size
      rather than the playlist length, so count the rows you actually receive.

      A duplicate means the same track id appearing more than once. Ignore different
      recordings of the same song — a remaster, a live version or a different mix is not
      a duplicate.

      Before removing anything, show me the playlist you picked, its track count, and
      each duplicate you found with how many copies exist. Then remove the extra copies,
      keeping the earliest occurrence of each. Removal will ask me to confirm; if I
      decline, stop and leave the playlist untouched.
    timestamp: 1787924907831
    active: true
    contentType: text
systemPrompts: []
mcpConfig: |-
  [
    {
      "name": "spotify",
      "config": {
        "command": "uvx",
        "args": [
          "spotify-mcp-jamiew"
        ],
        "env": {
          "SPOTIFY_CLIENT_ID": "{{vault:spotify-mcp-client-id}}",
          "SPOTIFY_CLIENT_SECRET": "{{vault:spotify-mcp-client-secret}}",
          "SPOTIFY_REDIRECT_URI": "http://127.0.0.1:8888"
        }
      },
      "enabled": true,
      "disabledTools": []
    }
  ]
enabledTools:
  - get_user_playlists
  - get_playlist_info
  - get_playlist_tracks
  - remove_tracks_from_playlist
clientTools: []
auth:
  type: bearer
  credentials:
    https://api.anthropic.com: "{{ANTHROPIC_API_KEY}}"
order: 3497204497000710
